name: Build xsdk bootstrap (not the app)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"
      - "README.md"
      - "docs/**"

permissions:
  contents: read

jobs:
  build-xsdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex texinfo libgmp-dev libmpfr-dev libmpc-dev curl xz-utils patch python3 cmake ninja-build git

      - name: Clone upstream xsdk
        run: git clone --depth 1 https://github.com/xenosworks/xsdk.git "$GITHUB_WORKSPACE/xsdk"

      - name: Build xsdk toolchain
        working-directory: ${{ github.workspace }}/xsdk
        env:
          PREFIX: ${{ runner.temp }}/xsdk-gcc
          WORK: ${{ runner.temp }}/xsdk-gcc-work
          JOBS: "2"
        run: |
          chmod +x tools/toolchain/build.sh
          tools/toolchain/build.sh

      - name: Build official xsdk samples
        working-directory: ${{ github.workspace }}/xsdk
        env:
          PATH: ${{ runner.temp }}/xsdk-gcc/bin:${{ env.PATH }}
        run: |
          make -j2
          make samples

      - name: Verify bootstrap XEX exists
        run: |
          test -s "$GITHUB_WORKSPACE/xsdk/build/samples/template/title.xex"
          file "$GITHUB_WORKSPACE/xsdk/build/samples/template/title.xex"
          sha256sum "$GITHUB_WORKSPACE/xsdk/build/samples/template/title.xex"

      - name: Upload bootstrap XEX (sample only)
        uses: actions/upload-artifact@v4
        with:
          name: tomato-xbox360-bootstrap-xex
          path: xsdk/build/samples/template/title.xex
          if-no-files-found: error
          retention-days: 14
